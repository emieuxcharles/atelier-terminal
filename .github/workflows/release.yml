name: macOS release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Cargo.toml, .github/workflows/release.yml]
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
      - name: Test on runner architecture
        run: |
          CARGO_BUILD_TARGET="$(rustc -vV | sed -n 's/^host: //p')" cargo test --locked
      - name: Build and verify DMG
        run: sh scripts/dmg.sh
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          gh release create "v$VERSION" dist/*.dmg dist/*.sha256 --target "$GITHUB_SHA" --title "Atelier $VERSION" --notes-file docs/release-notes.md --prerelease
